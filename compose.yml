services:
  db:
    image: postgres:18
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=20    # add
    mem_limit: 256m                                                     # add
    environment:
      POSTGRES_DB: deliciousnessness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deliciousnessness"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    mem_limit: 600m                                                     # add
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/deliciousnessness
      DB_PASSWORD: ${DB_PASSWORD}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY}
      COOKIES_SECURE: ${COOKIES_SECURE:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      MAIL_SSL: ${MAIL_SSL:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_SEED_USERNAME: ${APP_SEED_USERNAME:-}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-}
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"   # add
    # Only this computer can reach the app directly. Visitors come through the tunnel or proxy,
    # which also gives them https. Without 127.0.0.1 the app would answer on every network
    # interface, over plain http, with no https in front of it.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata: