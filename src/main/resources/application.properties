spring.application.name=deliciousnessness
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/deliciousnessness
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
app.seed.username=${APP_SEED_USERNAME:}
app.seed.password=${APP_SEED_PASSWORD:}
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.forward-headers-strategy=framework
app.remember-me-key=${REMEMBER_ME_KEY}
# Cookies. Set COOKIES_SECURE=true when the site is served over https.
app.secure-cookies=${COOKIES_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${app.secure-cookies}
# Error pages never show messages or stack traces.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Public address of the site, used for the links in notification emails (no trailing slash).
app.public-url=${APP_PUBLIC_URL:}
# Email notifications are sent only when SPRING_MAIL_HOST and APP_MAIL_FROM are set.
app.mail.from=${APP_MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
# Port 587 providers (Gmail, Brevo) use STARTTLS. Cloudflare uses port 465 with TLS from the start:
# set MAIL_SSL=true and MAIL_STARTTLS=false for it.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
# Pictures uploaded from the recipe form. The form shrinks them first, so this is only a safety limit.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
