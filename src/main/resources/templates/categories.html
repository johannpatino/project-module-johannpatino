<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <a class="brand" href="/recipes">Deliciousnessness</a>
</header>

<main class="page form-page">

    <a class="back-link" href="/recipes">&larr; Back</a>
    <h1 class="recipe-title" style="margin-bottom:2rem">Categories</h1>

    <div class="form-card">
        <p class="hint" th:if="${#lists.isEmpty(categories)}">No categories yet.</p>

        <div class="category-row" th:each="category : ${categories}">

            <form th:action="@{/categories/{id}/rename(id=${category.id()})}" method="post"
                  class="category-rename">
                <input type="text" name="name" th:value="${category.name()}" required>
                <button type="submit" class="btn">Rename</button>
            </form>

            <span class="category-usage"
                  th:text="${category.recipeCount()} + (${category.recipeCount()} == 1 ? ' recipe' : ' recipes')">
                0 recipes
            </span>

            <form th:action="@{/categories/{id}/delete(id=${category.id()})}" method="post"
                  th:data-confirm="|Delete “${category.name()}”? It will be removed from ${category.recipeCount()} recipe(s).|">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/confirm :: dialog}"></div>
<script th:src="@{/js/confirm.js}"></script>
</body>
</html>
