<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">
    <span class="brand">Deliciousnessness</span>
</header>

<main class="page form-page">
    <h1 class="recipe-title" style="margin-bottom:2rem">Log in</h1>

    <form th:action="@{/login}" method="post" class="form-card">

        <p class="hint" th:if="${param.error}" style="color:var(--danger)">
            Wrong username or password.
        </p>
        <p class="hint" th:if="${param.logout}">You've been logged out.</p>

        <label class="field">
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required autofocus>
        </label>

        <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Log in</button>
        </div>
    </form>
</main>

</body>
</html>
