<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create your account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/icons/favicon.svg}" type="image/svg+xml">
    <link rel="icon" th:href="@{/icons/favicon-32.png}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
</head>
<body>

<header class="site-header">
    <span class="brand"><img th:src="@{/icons/logo.svg}" alt="" width="32" height="32">Deliciousnessness</span>
</header>

<main class="page form-page">
    <h1 class="recipe-title" style="margin-bottom:2rem">Create your account</h1>

    <div class="form-card" th:unless="${linkWorks}">
        <p class="form-problems">This invite link has already been used, has expired, or is not valid.
            Ask for a new one.</p>
        <div class="form-actions">
            <a class="btn" th:href="@{/login}">Log in</a>
        </div>
    </div>

    <form th:if="${linkWorks}" th:action="@{/signup/{token}(token=${token})}" method="post" class="form-card">

        <p class="form-problems" th:if="${problem}" th:text="${problem}">Problem.</p>
        <p class="hint">You were invited to browse, search and filter recipes.</p>

        <label class="field">
            <span>Username</span>
            <input type="text" name="username" th:value="${username}" autocomplete="username"
                   minlength="3" maxlength="64" required autofocus>
        </label>

        <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="new-password" th:attr="minlength=${minPassword}" required>
            <span class="hint" th:text="|At least ${minPassword} characters. A few random words work well.|">At least 12 characters.</span>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create account</button>
        </div>
    </form>
</main>

</body>
</html>
