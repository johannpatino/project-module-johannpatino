<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deliciousnessness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header">

    <a class="brand" href="/recipes">Deliciousnessness</a>

    <form method="get" action="/recipes" class="filters">

        <div class="searchbar">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input type="search" name="q" th:value="${q}" placeholder="Search recipes...">
        </div>

        <details class="filter-drop">
            <summary>Filters</summary>

            <div class="filter-panel">

                <fieldset>
                    <legend>Season</legend>
                    <label th:each="s : ${seasons}">
                        <input type="checkbox" name="seasons" th:value="${s}"
                               th:checked="${selectedSeasons.contains(s)}">
                        <span th:text="${#strings.toLowerCase(s)}">summer</span>
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Category</legend>
                    <div class="filter-scroll">
                        <label th:each="category : ${allCategories}">
                            <input type="checkbox" name="categories"
                                   th:value="${category.id()}"
                                   th:checked="${selectedCategories.contains(category.id())}">
                            <span th:text="${category.name()}">soup</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="ingredient-picker">
                    <legend>Ingredients</legend>

                    <input type="text" id="ingredient-search" autocomplete="off"
                           placeholder="Search ingredient...">
                    <ul id="ingredient-suggestions" hidden></ul>

                    <div id="ingredient-chips">
                        <span class="chip" th:each="ing : ${selectedIngredients}">
                            <span th:text="${ing.canonicalName()}">onion</span>
                            <input type="hidden" name="ingredients" th:value="${ing.id()}">
                            <button type="button" class="chip-remove" aria-label="Remove">&times;</button>
                        </span>
                    </div>
                </fieldset>

                <div class="filter-actions">
                    <a href="/recipes">Clear all</a>
                    <button type="submit" class="btn btn-primary">Apply filters</button>
                </div>
            </div>
        </details>
    </form>

    <a class="btn btn-primary" href="/recipes/new">+ Add a recipe</a>
    <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit" class="btn">Log out</button>
    </form>
</header>

<main class="page">
    <div id="results">
        <th:block th:fragment="results">

            <div class="results-head">
                <h1 th:text="${#strings.isEmpty(q)} ? 'All recipes' : |Results for “${q}”|">All recipes</h1>
                <p class="results-count"
                   th:text="${#lists.size(recipes)} + (${#lists.size(recipes)} == 1 ? ' recipe' : ' recipes')">0 recipes</p>
            </div>

            <div class="grid" th:if="${not #lists.isEmpty(recipes)}">
                <article class="card" th:each="recipe : ${recipes}">

                    <a class="card-media" th:href="@{/recipes/{id}(id=${recipe.id()})}"
                       th:classappend="${recipe.imageUrl()} == null ? 'is-empty' : ''">
                        <img th:if="${recipe.imageUrl()}" th:src="${recipe.imageUrl()}"
                             th:alt="${recipe.recipeName()}" loading="lazy">
                        <th:block th:if="${recipe.imageUrl()} == null">&#127859;</th:block>
                    </a>

                    <div class="card-body">
                        <h2>
                            <a th:href="@{/recipes/{id}(id=${recipe.id()})}"
                               th:text="${recipe.recipeName()}">Recipe name</a>
                        </h2>

                        <p class="card-meta">
                            <span th:if="${recipe.cookTimeMinutes()}"
                                  th:text="|&#9201; ${recipe.cookTimeMinutes()} min|">&#9201; 30 min</span>
                            <span th:if="${recipe.servings()}"
                                  th:text="|&#127869; ${recipe.servings()} servings|">&#127869; 4 servings</span>
                        </p>
                    </div>
                </article>
            </div>

            <p class="empty-state" th:if="${#lists.isEmpty(recipes)}">
                No recipes match those filters.
            </p>
        </th:block>
    </div>
</main>

<script th:src="@{/js/ingredient-picker.js}"></script>
<script th:src="@{/js/live-search.js}"></script>
</body>
</html>
